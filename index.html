<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Judging scoreboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --ink:#16213A; --muted:#5B6578; --rule:#D5DAD8;
  --a:#0F7A6C; --a-soft:#DDF0EC; --b:#7A3E6E; --b-soft:#F1E3EE; --gold:#B8871E; --warn:#B4472B;
  --focus:#2563EB; --tint:#EEF1F0;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10161F; --surface:#18202C; --ink:#E7ECF2; --muted:#9AA5B5; --rule:#2C3748;
    --a:#3FBFA9; --a-soft:#163A35; --b:#D58AC5; --b-soft:#3A2236; --gold:#E2B24A; --warn:#EE8A6E; --focus:#7AA7FF; --tint:#1F2937;
  }
}
:root[data-theme="dark"]{
  --bg:#10161F; --surface:#18202C; --ink:#E7ECF2; --muted:#9AA5B5; --rule:#2C3748;
  --a:#3FBFA9; --a-soft:#163A35; --b:#D58AC5; --b-soft:#3A2236; --gold:#E2B24A; --warn:#EE8A6E; --focus:#7AA7FF; --tint:#1F2937;
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Barlow,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.45}
h1,h2,h3,.num,.tab,button.big,.lvl-btn,.tname{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.hidden{display:none!important}
.dim{color:var(--muted)}

header{background:var(--ink);color:var(--bg)}
header .wrap{display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap;padding-top:14px;padding-bottom:14px}
header h1{margin:0;font-size:1.7rem;font-weight:700;flex:1 1 auto}
nav{display:flex;gap:4px;flex-wrap:wrap}
.tab{background:transparent;border:0;color:inherit;opacity:.72;font-size:1.15rem;font-weight:600;padding:6px 12px;border-radius:6px;cursor:pointer}
.tab:hover{opacity:1}
.tab[aria-current="true"]{opacity:1;background:rgba(127,127,127,.25)}

main{padding:26px 0 60px}
.notice{border:1px solid var(--warn);color:var(--warn);background:var(--surface);padding:10px 14px;border-radius:8px;margin-bottom:18px}
.head{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.head h2{margin:0;font-size:2.3rem;line-height:1}

button.big{background:var(--ink);color:var(--bg);border:0;border-radius:8px;padding:10px 18px;font-size:1.2rem;font-weight:600;cursor:pointer}
button.big:disabled{opacity:.6;cursor:default}
.ghost{display:inline-block;background:transparent;border:1px solid var(--rule);border-radius:8px;padding:7px 12px;cursor:pointer;color:inherit;text-decoration:none;font-size:1rem;line-height:1.45}
.ghost:disabled{opacity:.6;cursor:default}
button.danger{border-color:var(--warn);color:var(--warn)}
label{display:block;font-weight:600;font-size:.92rem;margin:12px 0 4px}
input[type=text],input[type=password],input[type=number],input[type=search],textarea{width:100%;border:1px solid var(--rule);background:var(--bg);border-radius:8px;padding:9px 11px}
textarea{min-height:150px;resize:vertical}
.err{color:var(--warn);min-height:1.4em;margin-top:8px}
.empty{background:var(--surface);border:1px dashed var(--rule);border-radius:12px;padding:24px;max-width:620px}
.empty h3{margin:0 0 6px;font-size:1.5rem}
.empty p{margin:0}

/* Rubric */
.note{background:var(--surface);border:1px solid var(--rule);border-left:6px solid var(--a);border-radius:10px;padding:16px 20px;margin-bottom:20px;max-width:760px}
.note p{margin:0 0 8px}
.note ol{margin:0;padding-left:1.4em}
.note li{padding:2px 0}
.note li span{color:var(--muted)}
.rtable{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0;background:var(--surface);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.rtable th,.rtable td{padding:12px 14px;vertical-align:top;border-bottom:1px solid var(--rule);text-align:left}
.rtable tr:last-child td{border-bottom:0}
.rtable thead th{background:var(--ink);color:var(--bg);font-family:"Barlow Condensed",Arial,sans-serif;font-size:1.1rem;font-weight:600}
.rtable thead th small{display:block;font-family:Barlow,Arial,sans-serif;font-size:.8rem;font-weight:400;opacity:.8}
.rtable .crit{width:31%;border-right:1px solid var(--rule)}
.rtable .crit h3{margin:0 0 2px;font-size:1.35rem}
.rtable .crit .w{display:inline-block;font-weight:600;font-size:.85rem;background:var(--a-soft);color:var(--a);padding:1px 8px;border-radius:99px;margin-bottom:8px}
.rtable .crit p{margin:0;color:var(--muted);font-size:.95rem;white-space:pre-line}
.rtable td.lvl{font-size:.9rem;white-space:pre-line;overflow-wrap:anywhere}
.rtable td.lvl:nth-child(even){background:var(--tint)}
@media (max-width:820px){
  .rtable{table-layout:auto}
  .rtable,.rtable tbody,.rtable tr,.rtable td{display:block;width:auto!important}
  .rtable thead{display:none}
  .rtable tr{border-bottom:6px solid var(--bg)}
  .rtable .crit{border-right:0}
  .rtable td.lvl{display:grid;grid-template-columns:96px 1fr;gap:10px;background:transparent!important}
  .rtable td.lvl::before{content:attr(data-label);font-family:"Barlow Condensed",Arial,sans-serif;font-weight:700}
}

/* Login */
.card{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:22px;max-width:440px}
.card h2{margin:0 0 4px;font-size:2rem}

/* Scoring */
.score-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.score-head h2{margin:0;font-size:2.2rem;flex:1 1 auto}
.score-head input{max-width:280px}
.score-head .who{color:var(--muted);font-weight:600;margin-top:4px}
.welcome{background:var(--surface);border:1px solid var(--rule);border-top:5px solid var(--accent,var(--ink));border-radius:12px;padding:20px 22px;margin:0 0 18px}
.welcome h3{margin:0;font-size:2rem;line-height:1.1}
.welcome .wtitle{color:var(--muted);margin:4px 0 12px;font-size:.95rem}
.welcome ul{margin:0 0 14px;padding-left:1.2em}
.welcome li{padding:2px 0}
.jname{display:block;font-size:.78rem;color:var(--muted);font-weight:400;white-space:normal;line-height:1.2;margin-top:2px}
.jrow{display:grid;grid-template-columns:1.2fr 1fr;gap:0 10px;border-top:1px solid var(--rule);padding:6px 0 10px}
.jrow:first-of-type{border-top:0}
.jrow .full{grid-column:1/-1}
.status{color:var(--muted);font-size:.92rem;margin:0 0 6px}
.progress{height:8px;background:var(--rule);border-radius:4px;overflow:hidden;margin:6px 0 18px}
.progress i{display:block;height:100%;background:var(--accent,var(--ink));transition:width .3s}
.teams{display:grid;gap:14px}
.team{background:var(--surface);border:1px solid var(--rule);border-left:5px solid var(--rule);border-radius:10px;padding:16px 18px}
.team.done{border-left-color:var(--accent)}
.team-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.tname{font-size:1.65rem;font-weight:700;line-height:1.1}
.tchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tchip{font-size:.82rem;padding:2px 10px;border-radius:99px;background:var(--tint);color:var(--muted);font-weight:600}
.tps{margin:10px 0 0;padding:8px 12px;background:var(--tint);border-radius:8px;font-size:.92rem;line-height:1.4}
.tps b{font-family:"Barlow Condensed",Arial,sans-serif;font-size:1rem;margin-right:4px}
table.data .ps{font-size:.84rem;white-space:normal;margin-top:2px;max-width:360px}
.tchip.school{background:var(--accent-soft,var(--tint));color:var(--accent,var(--muted))}
.tscore{text-align:right;white-space:nowrap}
.tscore .num{font-size:1.9rem;font-weight:700}
.members{list-style:none;margin:12px 0 6px;padding:10px 0 0;border-top:1px solid var(--rule);display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px 16px}
.members li{display:flex;flex-direction:column;line-height:1.25}
.members .mname{font-weight:600}
.members .mrole{color:var(--muted);font-size:.84rem}
.crow{display:grid;grid-template-columns:minmax(150px,1fr) auto;gap:4px 14px;align-items:center;padding:8px 0;border-top:1px solid var(--rule)}
.crow .cname{font-weight:600}
.crow .cname span{color:var(--muted);font-weight:400}
.crow .pick{display:flex;gap:6px}
.lvl-btn{width:44px;height:40px;border:1px solid var(--rule);background:var(--bg);border-radius:8px;font-size:1.25rem;font-weight:700;cursor:pointer}
.lvl-btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.crow .hint{grid-column:1/-1;font-size:.85rem;color:var(--muted);min-height:1.2em;white-space:pre-line}
@media (max-width:560px){ .crow{grid-template-columns:1fr} .lvl-btn{flex:1;width:auto} .crow .pick{width:100%} .score-head input{max-width:none} }

/* Scoreboard */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;margin-bottom:16px}
.toolbar b{margin-right:4px}
.roundbar{display:flex;gap:10px 14px;flex-wrap:wrap;align-items:center;background:var(--surface);border:1px solid var(--rule);border-left:5px solid var(--gold);border-radius:10px;padding:12px 14px;margin-bottom:16px}
.roundbar .msg{flex:1 1 260px}
.rchip{display:inline-block;font-size:.78rem;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--gold);color:#fff;vertical-align:middle}
.veil{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:28px;text-align:center}
.veil h3{margin:0 0 6px;font-size:1.8rem}
.veil p{margin:0 auto 16px;max-width:52ch}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:7px 14px;cursor:pointer;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--rule);border-radius:10px}
table.data{border-collapse:collapse;width:100%;min-width:640px}
table.data th,table.data td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--rule);white-space:nowrap;vertical-align:top}
table.data th{font-size:.85rem;color:var(--muted);font-weight:600}
table.data tr:last-child td{border-bottom:0}
table.data .r{text-align:right}
table.data .sub{font-size:.84rem;color:var(--muted);white-space:normal}
.rank{font-family:"Barlow Condensed",Arial,sans-serif;font-size:1.5rem;font-weight:700;width:56px}
tr.top1 .rank{color:var(--gold)}
.avg{font-family:"Barlow Condensed",Arial,sans-serif;font-size:1.5rem;font-weight:700}
.chip{display:inline-block;font-size:.78rem;font-weight:600;padding:1px 8px;border-radius:99px}
.chip.A{background:var(--a-soft);color:var(--a)} .chip.B{background:var(--b-soft);color:var(--b)}
.bar{height:6px;background:var(--rule);border-radius:3px;width:80px;display:inline-block;vertical-align:middle;margin-left:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink)}
.podium{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:18px}
.pod{background:var(--surface);border:1px solid var(--rule);border-left:6px solid var(--rule);border-radius:10px;padding:14px 16px}
.pod.p1{border-left-color:var(--gold)}
.pod .place{font-family:"Barlow Condensed",Arial,sans-serif;font-weight:600;color:var(--muted)}
.pod .name{font-size:1.25rem;font-weight:600;margin:2px 0 0}
.pod .school{color:var(--muted);font-size:.9rem;margin-bottom:6px}
.pod .score{font-family:"Barlow Condensed",Arial,sans-serif;font-size:2.6rem;font-weight:700;line-height:1}
table.data.r2 th{white-space:normal;vertical-align:bottom;max-width:118px;line-height:1.25}
table.data.r2 td:nth-child(2){min-width:170px;white-space:normal}
.progress-list{max-width:560px;margin:14px auto 0;text-align:left}

/* Settings */
.admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.box{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:16px 18px}
.box h3{margin:0 0 6px;font-size:1.4rem}
.codes{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.tlist{margin:6px 0 0;padding-left:1.5em;font-size:.92rem;max-height:260px;overflow:auto}
.tlist li{padding:1px 0}
details summary{cursor:pointer;font-weight:600;margin-top:10px}
.cedit{border-top:1px solid var(--rule);padding:12px 0}
.cedit:first-of-type{border-top:0}
.cedit .top{display:grid;grid-template-columns:1fr 90px auto;gap:8px;align-items:end}
.cedit .top label{margin:0}
.cedit textarea{min-height:60px}
.cedit .levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.cedit .levels textarea{min-height:70px;font-size:.9rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
@media (prefers-reduced-motion: reduce){.progress i{transition:none}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1 id="eventName">Judging scoreboard</h1>
    <nav aria-label="Main">
      <button class="tab" data-view="rubric">Rubric</button>
      <button class="tab hidden" data-view="score" id="tabScore">Scoring</button>
      <button class="tab hidden" data-view="board" id="tabBoard">Scoreboard</button>
      <button class="tab hidden" data-view="admin" id="tabAdmin">Settings</button>
      <button class="tab" data-view="login" id="tabLogin">Log in</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <div id="notice" class="notice hidden" role="status"></div>
  <section id="view-rubric" class="hidden"></section>
  <section id="view-login" class="hidden"></section>
  <section id="view-score" class="hidden"></section>
  <section id="view-board" class="hidden"></section>
  <section id="view-admin" class="hidden"></section>
</main>

<script>
(function(){
  /* ============================================================
     YOUR APPS SCRIPT WEB APP URL (ends in /exec)
     ============================================================ */
  const API_URL = "https://script.google.com/macros/s/AKfycbygyO6xRw-JZNazjdt3qXtAf4qWsBjI7f6nfOOrWWuEh8KczZL8d4bEVlEBwWEbY10/exec";

  const ADMIN_POLL_MS = 5000, CONFIG_POLL_MS = 15000;
  const XLSX_URL = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
  const JUDGES = [1,2,3];
  const ALL_JUDGES = ["A1","A2","A3","B1","B2","B3"];
  const PANEL_NAME = {A:"Panel A", B:"Panel B"};
  const LEVEL_NAMES = ["Poor","Fair","Good","Very good","Excellent"];
  const CODE_KEYS = [["A1","Panel A, Judge 1"],["A2","Panel A, Judge 2"],["A3","Panel A, Judge 3"],["B1","Panel B, Judge 1"],["B2","Panel B, Judge 2"],["B3","Panel B, Judge 3"],["admin","Organiser"]];

  const state = {
    config: {event:"Judging scoreboard", rubric:[], teams:{A:[],B:[]}},
    configLoaded: false,
    scores: {},          // "A-1" -> {scores:{teamId:{criterionIndex:1..5}}}; judges only hold their own
    codes: null, sheetUrl: "", exportMsg: "",
    me: null,            // the logged-in judge's {name, title}
    judges: null,        // organiser only: {A1:{name,title}, ...}
    round: 1,            // judges: which round they're scoring
    round2: null,        // organiser: {active, teams, startedAt, scores}
    boardRound: 1, revealed2: false,
    view: "login", revealed: false, lbFilter: "all", find: "",
    session: null        // {role:"judge", panel, judge, code} | {role:"admin", code}
  };

  try {
    const s = JSON.parse(sessionStorage.getItem("judging-session3") || "null");
    if (s && (s.role === "admin" || s.role === "judge") && s.code) state.session = s;
  } catch(e){}
  function saveSession(){ try { state.session ? sessionStorage.setItem("judging-session3", JSON.stringify(state.session)) : sessionStorage.removeItem("judging-session3"); } catch(e){} }

  const $ = (s, r=document) => r.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const fmt = n => n == null ? "–" : (Math.round(n*10)/10).toString();
  const r2 = n => Math.round(n*100)/100;
  const isJudge = () => state.session?.role === "judge";
  const isAdmin = () => state.session?.role === "admin";
  function notice(t){ const n = $("#notice"); n.textContent = t || ""; n.classList.toggle("hidden", !t); }

  /* ---------- Server ---------- */
  async function readJson(r){
    const text = await r.text();
    try { return JSON.parse(text); }
    catch(e){
      if (/accounts\.google|ServiceLogin|Sign in/i.test(text)) throw new Error("Google asked for a sign-in. In Apps Script, set 'Who has access' to Anyone and deploy a new version.");
      throw new Error("The score sheet returned an error page. Open the /exec URL in a new tab to see it.");
    }
  }
  async function api(body){
    let r;
    try {
      r = body ? await fetch(API_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(body)})
               : await fetch(API_URL + "?t=" + Date.now());
    } catch(e){ throw new Error("Can't reach the score sheet. Check your internet connection."); }
    const data = await readJson(r);
    if (!data.ok) throw new Error(data.error || "Request failed");
    return data;
  }
  function setConfig(cfg){
    if (!cfg) return;
    const next = {event: cfg.event, rubric: cfg.rubric || [], teams: cfg.teams || state.config.teams || {A:[],B:[]}};
    const changed = JSON.stringify([state.config.rubric, state.config.teams]) !== JSON.stringify([next.rubric, next.teams]);
    state.config = next; state.configLoaded = true;
    renderTabs();
    if (state.view === "rubric" && changed) renderRubric();
    if (state.view === "score" && changed && isJudge() && !dirtyTeams.size && !writing) renderScoring();
    if (state.view === "admin" && changed) renderTeamsBox();
  }
  async function pollConfig(){
    if (document.hidden || isAdmin()) return;
    try {
      if (isJudge()){
        const d = await api({action:"me", code: state.session.code});
        if ((d.config?.round || 1) !== state.round) await switchRound();
        else setConfig(d.config);
      }
      else setConfig((await api()).config);
      notice("");
    } catch(e){
      notice(isJudge() && /passcode/i.test(e.message) ? "Your passcode has been changed by the organiser. Log out and log in with the new one." : e.message);
    }
  }
  let switching = false;
  async function switchRound(){
    if (switching || !isJudge()) return;
    switching = true;
    clearTimeout(saveTimer); saveTimer = null; dirtyTeams.clear();
    try { const code = state.session.code; startSession(await api({action:"login", code}), code); }
    catch(e){ notice(e.message); }
    switching = false;
  }
  function applyAdmin(d){
    state.scores = d.scores || {}; state.sheetUrl = d.sheetUrl || state.sheetUrl;
    if (d.judges) state.judges = d.judges;
    state.round2 = d.round2 || null;
    if (!state.round2) state.boardRound = 1;
  }
  let adminPolling = false;
  async function pollAdmin(){
    if (!isAdmin() || adminPolling || document.hidden) return;
    adminPolling = true;
    try {
      const d = await api({action:"allScores", code: state.session.code});
      applyAdmin(d);
      setConfig(d.config);
      if (state.view === "board") renderBoard();
      notice("");
    }
    catch(e){ if (/passcode/i.test(e.message)) logout(); else notice(e.message); }
    adminPolling = false;
  }

  /* ---------- Maths ---------- */
  function weightedScore(entry){
    const rub = state.config.rubric;
    if (!entry || !rub.length) return null;
    let t = 0;
    for (let ci=0; ci<rub.length; ci++){
      const v = Number(entry[ci]);
      if (!(v >= 1 && v <= 5)) return null;
      t += v/5 * Number(rub[ci].weight || 0);
    }
    return r2(t);
  }
  const entryFor = (p,j,id) => state.scores[p+"-"+j]?.scores?.[id] || null;
  const maxScore = () => state.config.rubric.reduce((a,c)=>a+Number(c.weight||0),0);
  function teamRows(filter){
    const rows = [];
    for (const p of ["A","B"]){
      if (filter !== "all" && filter !== p) continue;
      state.config.teams[p].forEach(t => {
        const totals = JUDGES.map(j => weightedScore(entryFor(p,j,t.id)));
        const got = totals.filter(x => x !== null);
        rows.push({panel:p, t, totals, count:got.length, avg: got.length ? r2(got.reduce((a,b)=>a+b,0)/got.length) : null});
      });
    }
    rows.sort((x,y) => (y.avg ?? -1) - (x.avg ?? -1) || y.count - x.count || x.t.name.localeCompare(y.t.name, undefined, {numeric:true}));
    let rank = 0, prev = null;
    rows.forEach((r,i) => { if (r.avg !== null && r.avg !== prev){ rank = i+1; prev = r.avg; } r.rank = r.avg === null ? null : rank; });
    return rows;
  }

    const total = state.config.teams.A.length + state.config.teams.B.length;
    if (!total){
      el.innerHTML = `<div class="empty"><h3>No teams yet</h3><p class="dim">Paste your team list into the Teams tab of the Google Sheet (Name, School, Level, Role, Team, No of pax). It appears here within a few seconds.</p>
        ${state.sheetUrl ? `<p style="margin-top:12px"><a class="ghost" href="${esc(state.sheetUrl)}" target="_blank" rel="noopener">Open Google Sheet</a></p>` : ""}</div>`;
      return;
    }
    if (!state.revealed){
      const progress = ["A","B"].flatMap(p => JUDGES.map(j => {
        const teams = state.config.teams[p];
        const d = teams.filter(t => weightedScore(entryFor(p,j,t.id)) !== null).length;
        return `<tr><td><span class="chip ${p}">${PANEL_NAME[p]}</span> Judge ${j}<span class="jname">${esc(judgeName(p,j))}</span></td><td class="r">${d} / ${teams.length}${d===teams.length && teams.length ? " ✓" : ""}</td></tr>`;
      })).join("");
      el.innerHTML = `
        ${exportBar()}${roundBar()}
        <div class="veil">
          <h3>Scoreboard hidden</h3>
          <p class="dim">Only the organiser can open this page. Results stay hidden until you reveal them, so it's safe to leave this screen open or projected.</p>
          <button class="big" id="reveal">Reveal scoreboard</button>
          <h3 style="font-size:1.3rem;margin-top:26px">Judging progress</h3>
          <div class="scroll progress-list"><table class="data" style="min-width:0">
            <thead><tr><th>Judge</th><th class="r">Teams fully scored</th></tr></thead>
            <tbody>${progress}</tbody>
          </table></div>
        </div>`;
      $("#reveal").addEventListener("click", () => { state.revealed = true; renderBoard(); });
      wireExports(); wireRounds();
      return;
    }
    const rows = teamRows(state.lbFilter), mx = maxScore(), scored = rows.filter(r => r.avg !== null);
    const body = rows.map(r => {
      const pct = r.avg !== null && mx ? Math.round(r.avg/mx*100) : 0;
      return `<tr class="${r.rank===1 ? "top1":""}">
        <td class="rank">${r.rank ?? "–"}</td>
        <td><b>${esc(r.t.name)}</b><div class="sub">${esc(r.t.school)}</div>${r.t.ps ? `<div class="sub ps">PS: ${esc(r.t.ps)}</div>` : ""}</td>
        <td>${esc(r.t.level)}</td>
        <td><span class="chip ${r.panel}">${PANEL_NAME[r.panel]}</span></td>
        ${r.totals.map((t,ji) => `<td class="r ${t===null?"dim":""}">${fmt(t)}${state.lbFilter==="all" ? `<span class="jname">${esc(judgeName(r.panel, ji+1))}</span>` : ""}</td>`).join("")}
        <td class="r dim">${r.count}/3</td>
        <td class="r"><span class="avg">${fmt(r.avg)}</span><span class="bar" aria-hidden="true"><i style="width:${pct}%"></i></span></td>
      </tr>`;
    }).join("");
    el.innerHTML = `
      ${exportBar()}${roundBar()}
      <div class="head">
        <h2>Scoreboard</h2>
        <div class="row" style="margin:0">
          <div class="seg" role="group" aria-label="Filter by panel">
            ${["all","A","B"].map(f => `<button data-f="${f}" aria-pressed="${state.lbFilter===f}">${f==="all"?"All teams":PANEL_NAME[f]}</button>`).join("")}
          </div>
          <button class="ghost" id="hide">Hide scoreboard</button>
        </div>
      </div>
      ${scored.length ? `<div class="podium">${scored.slice(0,3).map((r,i) => `
        <div class="pod ${r.rank===1?"p1":""}">
          <div class="place">${["First","Second","Third"][r.rank-1] || "Place " + r.rank}</div>
          <div class="name">${esc(r.t.name)} <span class="chip ${r.panel}">${PANEL_NAME[r.panel]}</span></div>
          <div class="school">${esc(r.t.school)}${r.t.level ? ", " + esc(r.t.level) : ""}${r.t.ps ? `<br>PS: ${esc(r.t.ps)}` : ""}</div>
          <div class="score">${fmt(r.avg)}<span class="dim" style="font-size:1.1rem"> / ${mx}</span></div>
        </div>`).join("")}</div>` : `<p class="dim">No complete scores yet. A team appears in the ranking once a judge has scored all ${state.config.rubric.length} criteria for it.</p>`}
      <div class="scroll"><table class="data">
        <thead><tr><th>Rank</th><th>Team</th><th>Level</th><th>Panel</th>${JUDGES.map(j => `<th class="r">${state.lbFilter==="all" ? `Judge ${j}` : esc(judgeName(state.lbFilter, j))}</th>`).join("")}<th class="r">Scored</th><th class="r">Average / ${mx}</th></tr></thead>
        <tbody>${body}</tbody>
      </table></div>
      <p class="dim" style="font-size:.9rem;margin-top:10px">Each judge's score is weighted: (score ÷ 5) × criterion weight, added up to a total out of ${mx}. The average uses the judges who have scored every criterion for that team. Ties share a rank. Updates every few seconds.</p>`;
    el.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => { state.lbFilter = b.dataset.f; renderBoard(); }));
    $("#hide").addEventListener("click", () => { state.revealed = false; renderBoard(); });
    wireExports(); wireRounds();
  }

  function loadXLSX(){
    if (window.XLSX) return Promise.resolve(window.XLSX);
    return new Promise((res, rej) => {
      const s = document.createElement("script");
      s.src = XLSX_URL;
      s.onload = () => res(window.XLSX);
      s.onerror = () => rej(new Error("Couldn't load the Excel tool. Check your connection."));
      document.head.appendChild(s);
    });
  }
  async function downloadExcel(){
    setExportMsg("Preparing Excel file…");
    try {
      const X = await loadXLSX(), rub = state.config.rubric;
      const lead = [["Rank","Team","School","Level","Problem statement","Panel","Members","Judge 1","Judge 2","Judge 3","Judges scored","Average /100"]];
      teamRows("all").forEach(r => lead.push([r.rank ?? "", r.t.name, r.t.school, r.t.level, r.t.ps || "", PANEL_NAME[r.panel], memberText(r.t), ...r.totals.map(t => t ?? ""), `${r.count}/3`, r.avg ?? ""]));
      const brk = [["Panel","Team","School","Problem statement","Judge",...rub.map(c => `${c.name} (${c.weight}%)`),"Weighted /100"]];
      for (const p of ["A","B"]) state.config.teams[p].forEach(t => JUDGES.forEach(j => {
        const e = entryFor(p,j,t.id) || {};
        brk.push([PANEL_NAME[p], t.name, t.school, t.ps || "", `Judge ${j}: ${judgeName(p,j)}`, ...rub.map((_,ci) => e[ci] ?? ""), weightedScore(e) ?? ""]);
      }));
      const wb = X.utils.book_new();
      const ws1 = X.utils.aoa_to_sheet(lead);
      ws1["!cols"] = [6,24,28,10,45,10,50,9,9,9,13,13].map(w => ({wch:w}));
      const ws2 = X.utils.aoa_to_sheet(brk);
      ws2["!cols"] = [10,24,28,45,34,...rub.map(() => ({wch:16})), 14].map(w => typeof w === "number" ? {wch:w} : w);
      X.utils.book_append_sheet(wb, ws1, "Leaderboard");
      X.utils.book_append_sheet(wb, ws2, "Score breakdown");
      const jrows = [["Panel","Judge","Name","Role","Teams fully scored"]];
      for (const p of ["A","B"]) JUDGES.forEach(j => {
        const teams = state.config.teams[p];
        jrows.push([PANEL_NAME[p], "Judge " + j, judgeName(p,j), state.judges?.[p+j]?.title || "",
          `${teams.filter(t => weightedScore(entryFor(p,j,t.id)) !== null).length} / ${teams.length}`]);
      });
      const ws3 = X.utils.aoa_to_sheet(jrows);
      ws3["!cols"] = [10,9,40,80,18].map(w => ({wch:w}));
      X.utils.book_append_sheet(wb, ws3, "Judges");
      if (state.round2){
        const r2 = state.round2, jhead = ALL_JUDGES.map(k => `${PANEL_NAME[k[0]]} Judge ${k[1]}: ${judgeName(k[0], k[1])}`);
        const l2 = [["Rank","Team","School","Level","Problem statement","Round 1 panel","Round 1 average",...jhead,"Judges scored","Round 2 average /100"]];
        round2Rows().forEach(r => l2.push([r.rank ?? "", r.t.name, r.t.school, r.t.level, r.t.ps || "", PANEL_NAME[r.t.panel], r.t.r1Avg, ...r.totals.map(t => t ?? ""), `${r.count}/6`, r.avg ?? ""]));
        const b2 = [["Team","School","Problem statement","Judge",...rub.map(c => `${c.name} (${c.weight}%)`),"Weighted /100"]];
        r2.teams.forEach(t => ALL_JUDGES.forEach((k, i) => {
          const e = r2.scores?.[k[0]+"-"+k[1]]?.scores?.[t.id] || {};
          b2.push([t.name, t.school, t.ps || "", jhead[i], ...rub.map((_,ci) => e[ci] ?? ""), weightedScore(e) ?? ""]);
        }));
        const ws4 = X.utils.aoa_to_sheet(l2); ws4["!cols"] = [6,24,28,10,45,12,12,...jhead.map(() => 18),13,16].map(w => ({wch:w}));
        const ws5 = X.utils.aoa_to_sheet(b2); ws5["!cols"] = [24,28,45,40,...rub.map(() => 16),14].map(w => ({wch:w}));
        X.utils.book_append_sheet(wb, ws4, "Round 2 leaderboard");
        X.utils.book_append_sheet(wb, ws5, "Round 2 breakdown");
      }
      const name = (state.config.event || "judging").replace(/[^\w\- ]+/g, "").trim().replace(/\s+/g, "-").toLowerCase() || "judging";
      X.writeFile(wb, `${name}-results.xlsx`);
      setExportMsg("Excel file downloaded.");
    } catch(e){ setExportMsg(e.message); }
  }

  /* ---------- Settings (organiser only) ---------- */
  let draft = null;
  function renderAdmin(){
    draft = structuredClone(state.config);
    const codes = state.codes || {};
    $("#view-admin").innerHTML = `
      <div class="head"><h2>Settings</h2></div>
      <div class="admin-grid">
        <div class="box">
          <h3>Event</h3>
          <label for="evName">Event name</label><input id="evName" type="text" value="${esc(draft.event)}">
          <label for="code-admin">Organiser passcode</label><input id="code-admin" type="text" autocomplete="off" autocapitalize="off" value="${esc(codes.admin || "")}">
        </div>
        <div class="box">
          <h3>Judges and passcodes</h3>
          <p class="dim" style="margin:0 0 6px;font-size:.9rem">Each judge has their own passcode, and every score is recorded under their name. Give each judge only their own passcode.</p>
          ${CODE_KEYS.filter(([k]) => k !== "admin").map(([k,label]) => `
            <div class="jrow">
              <label class="full" style="margin-top:8px"><span class="chip ${k[0]}">${label}</span></label>
              <label>Name<input type="text" data-jn="${k}" value="${esc(state.judges?.[k]?.name || "")}"></label>
              <label>Passcode<input id="code-${k}" type="text" autocomplete="off" autocapitalize="off" value="${esc(codes[k] || "")}"></label>
              <label class="full">Role<input type="text" data-jt="${k}" value="${esc(state.judges?.[k]?.title || "")}"></label>
            </div>`).join("")}
        </div>
        <div class="box" id="teamsBox"></div>
        <div class="box" style="grid-column:1/-1">
          <h3>Rubric</h3>
          <p class="dim" style="margin:0;font-size:.9rem">Weights should add up to 100. <span id="wsum"></span></p>
          <div id="critList"></div>
          <button class="ghost" id="addCrit">Add criterion</button>
        </div>
      </div>
      <div class="row">
        <button class="big" id="saveCfg">Save settings</button>
        <button class="ghost danger" id="resetAll">Clear all scores</button>
        <span id="adminMsg" class="dim" role="status"></span>
      </div>`;
    renderTeamsBox();
    renderCritList();
    $("#addCrit").addEventListener("click", () => { readCrits(); draft.rubric.push({name:"New criterion", weight:0, desc:"", levels:["","","","",""]}); renderCritList(); });
    $("#saveCfg").addEventListener("click", saveConfig);
    $("#resetAll").addEventListener("click", resetScores);
  }
  function renderTeamsBox(){
    const box = $("#teamsBox"); if (!box) return;
    const T = state.config.teams;
    const list = p => `<details ${T[p].length ? "" : "open"}><summary>${PANEL_NAME[p]}: ${T[p].length} teams</summary>
      ${T[p].length ? `<ol class="tlist">${T[p].map(t => `<li>${esc(t.name)} <span class="dim">${esc(t.school)}${t.level ? ", " + esc(t.level) : ""}, ${t.members.length} members</span><br><span class="dim" style="font-size:.85rem">${t.ps ? "PS: " + esc(t.ps) : "No problem statement found"}</span></li>`).join("")}</ol>` : `<p class="dim" style="margin:4px 0 0">None yet.</p>`}</details>`;
    box.innerHTML = `
      <h3>Teams</h3>
      <p class="dim" style="margin:0;font-size:.9rem">Teams come from the <b>Teams</b> tab of your Google Sheet: one row per person, in the columns Name, School, Level, Role, Team, No of pax. The first 22 teams go to Panel A and the rest to Panel B, unless you type A or B in the optional Panel column. Don't rename a team after judging starts, or its scores won't match.</p>
      <p class="dim" style="margin:8px 0 0;font-size:.9rem">Problem statements come from the <b>Problem statements</b> tab: team in column A, problem statement in column B.</p>
      ${list("A")}${list("B")}
      <div class="row">
        ${state.sheetUrl ? `<a class="ghost" href="${esc(state.sheetUrl)}" target="_blank" rel="noopener">Open Google Sheet</a>` : ""}
        <button class="ghost" id="reloadTeams">Reload team list</button>
      </div>`;
    $("#reloadTeams").addEventListener("click", pollAdmin);
  }
  function weightSum(){
    const s = [...document.querySelectorAll('#critList [data-k="weight"]')].reduce((a,x)=>a+(Number(x.value)||0),0);
    const el = $("#wsum"); if (!el) return;
    el.textContent = `Current total: ${s}.`; el.style.color = s === 100 ? "" : "var(--warn)";
  }
  function renderCritList(){
    $("#critList").innerHTML = draft.rubric.map((c,i) => `
      <div class="cedit">
        <div class="top">
          <label>Criterion ${i+1}<input type="text" data-k="name" value="${esc(c.name)}"></label>
          <label>Weight %<input type="number" min="0" max="100" data-k="weight" value="${esc(c.weight)}"></label>
          <button class="ghost danger" data-del="${i}">Remove</button>
        </div>
        <label>Description<textarea data-k="desc">${esc(c.desc)}</textarea></label>
        <div class="levels">${[0,1,2,3,4].map(l => `<label>${l+1} – ${LEVEL_NAMES[l]}<textarea data-l="${l}">${esc((c.levels||[])[l]||"")}</textarea></label>`).join("")}</div>
      </div>`).join("");
    $("#critList").querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", () => {
      readCrits(); if (draft.rubric.length <= 1) return; draft.rubric.splice(Number(b.dataset.del),1); renderCritList();
    }));
    $("#critList").oninput = weightSum;
    weightSum();
  }
  function readCrits(){
    draft.rubric = [...document.querySelectorAll("#critList .cedit")].map(r => ({
      name: r.querySelector('[data-k="name"]').value.trim() || "Untitled",
      weight: Math.max(0, Number(r.querySelector('[data-k="weight"]').value) || 0),
      desc: r.querySelector('[data-k="desc"]').value.trim(),
      levels: [0,1,2,3,4].map(l => r.querySelector(`[data-l="${l}"]`).value.trim())
    }));
  }
  async function saveConfig(){
    readCrits();
    const judges = {};
    CODE_KEYS.forEach(([k]) => { if (k === "admin") return; judges[k] = {name: $(`[data-jn="${k}"]`).value.trim(), title: $(`[data-jt="${k}"]`).value.trim()}; });
    const config = {event: $("#evName").value.trim() || "Judging scoreboard", rubric: draft.rubric, judges};
    const codes = {}; CODE_KEYS.forEach(([k]) => codes[k] = $("#code-"+k).value.trim());
    const vals = Object.values(codes).filter(Boolean);
    if (new Set(vals).size !== vals.length){ $("#adminMsg").textContent = "Every passcode must be different."; return; }
    $("#adminMsg").textContent = "Saving…";
    try {
      const d = await api({action:"saveConfig", code: state.session.code, config, codes});
      state.codes = d.codes; state.scores = d.scores || state.scores;
      if (d.judges) state.judges = d.judges;
      if (d.codes?.admin){ state.session.code = d.codes.admin; saveSession(); }
      setConfig(d.config); renderAdmin();
      $("#adminMsg").textContent = "Settings saved.";
    } catch(e){ $("#adminMsg").textContent = /passcode/i.test(e.message) && !/different/i.test(e.message) ? "Not saved: organiser passcode rejected. Log in again." : e.message; }
  }
  async function resetScores(){
    if (!confirm("Clear every score from both panels and both rounds, and remove round 2? This can't be undone.")) return;
    $("#adminMsg").textContent = "Clearing…";
    try { const d = await api({action:"reset", code: state.session.code}); applyAdmin(d); state.revealed = state.revealed2 = false; $("#adminMsg").textContent = "All scores cleared, and round 2 removed."; }
    catch(e){ $("#adminMsg").textContent = "Couldn't clear scores: " + e.message; }
  }

  /* ---------- Start ---------- */
  show(state.session ? "rubric" : "login");
  (async () => {
    if (state.session){
      try { startSession(await api({action:"login", code: state.session.code}), state.session.code); }
      catch(e){ state.session = null; saveSession(); show("login"); if (!/passcode/i.test(e.message)) notice(e.message); }
    }
    pollConfig();
  })();
  setInterval(pollConfig, CONFIG_POLL_MS);
  setInterval(pollAdmin, ADMIN_POLL_MS);
  document.addEventListener("visibilitychange", () => { if (!document.hidden){ pollConfig(); pollAdmin(); } });
})();
</script>
</body>
</html>
